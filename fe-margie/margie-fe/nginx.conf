# MARGIE's website build: a single-page app. Every path serves index.html; the
# app's own router takes it from there. /v1 never reaches here (the ingress
# sends it to the API).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Built files carry a hash in their name and never change: cache them for a year.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
